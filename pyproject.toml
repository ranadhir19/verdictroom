[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "verdictroom"
version = "0.1.0"
description = "A decision-debate engine: models argue, cross-examine, and a judge decides — into a tamper-evident record."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
verdictroom = "verdictroom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
